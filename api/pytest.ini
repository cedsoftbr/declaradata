[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
addopts = --reuse-db --cov=apps --cov-report=term-missing
env =
    D:DATABASE_URL=postgres://cesar:1306@localhost:5432/declaradata_test
    SECRET_KEY=test-secret-key
    DEBUG=false
    R2_ACCESS_KEY_ID=test-key
    R2_SECRET_ACCESS_KEY=test-secret
    R2_PUBLIC_BUCKET_NAME=test-bucket
    R2_ACCOUNT_ID=test-account
    R2_PUBLIC_URL=https://pub-test.r2.dev
    R2_ENDPOINT_URL=https://test.r2.cloudflarestorage.com
    CORS_ALLOWED_ORIGINS=
    CELERY_BROKER_URL=memory://
    CELERY_TASK_ALWAYS_EAGER=True
    CELERY_TASK_STORE_EAGER_RESULT=True
    CELERY_RESULT_BACKEND=cache+memory://
    DISABLE_THROTTLING=true
    SECURE_SSL_REDIRECT=false
    CACHE_BACKEND=django.core.cache.backends.dummy.DummyCache
filterwarnings =
    ignore::DeprecationWarning:botocore.*
    ignore::DeprecationWarning:google.*
    ignore::django.utils.deprecation.RemovedInDjango61Warning
    ignore:.*Normally Django will use.*:RuntimeWarning
    ignore:No directory at.*staticfiles.*:UserWarning
